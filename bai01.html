<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thơ Bốn Mùa</title>
    <style>
        /* Cấu trúc chung của trang */
        body {
            background-color: #FFFDE7; /* Nền vàng nhạt */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Khung bao bài thơ */
        .khung-tho {
            width: 640px;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Tiêu đề bài thơ */
        h1 {
            color: #D40000;
            background-color: #FFD9E6;
            font-size: 26px;
            margin: 0 0 28px 0;
            padding: 6px 0;
            text-transform: uppercase;
        }

        /* Khổ thơ 1 và Khổ thơ 3 */
        .kho-xanh {
            color: #0033CC;
            line-height: 1.7;
            font-style: italic;
        }

        /* Khổ thơ 2 */
        .kho-do {
            color: #D40000;
            line-height: 1.7;
        }

        /* Đường kẻ ngang giữa các khổ thơ */
        hr {
            border: none;
            border-top: 1px solid #0033CC;
            width: 55%;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="khung-tho">
        <h1>BỐN MÙA</h1>
        
        <!-- Khổ 1 -->
        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <!-- Khổ 2 (Chữ màu đỏ) -->
        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <!-- Khổ 3 -->
        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chợ xuân nắng mới soi đường
        </p>
    </div>

</body>
</html>
