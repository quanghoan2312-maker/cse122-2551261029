<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốn Mùa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="poem-container">
        <h1>BỐN MÙA</h1>
        
        <!-- Khổ 1 -->
        <p class="stanza-blue">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <!-- Khổ 2 -->
        <p class="stanza-red">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <!-- Khổ 3 -->
        <p class="stanza-blue">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chợ xuân nắng mới soi đường
        </p>
    </div>

</body>
</html>
